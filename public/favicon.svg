<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14151a"/>
      <stop offset="100%" stop-color="#060607"/>
    </radialGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9ad5"/>
      <stop offset="45%" stop-color="#9fe8ff"/>
      <stop offset="85%" stop-color="#d9ff8a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="chrome" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="55%" stop-color="#64748b"/>
      <stop offset="85%" stop-color="#1e2229"/>
      <stop offset="100%" stop-color="#090a0d"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark base -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Iridescent ambient aura -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="url(#rim)" stroke-width="1.2" opacity="0.4" filter="url(#glow)"/>

  <!-- Chrome liquid droplet / orb -->
  <path d="M32 10 C39 22 53 34 53 44 A21 21 0 1 1 11 44 C11 34 25 22 32 10 Z" fill="url(#chrome)" stroke="url(#rim)" stroke-width="1.4"/>

  <!-- Specular glare -->
  <ellipse cx="25" cy="32" rx="4.5" ry="9" fill="#ffffff" opacity="0.75" transform="rotate(-25 25 32)"/>
  <circle cx="23" cy="26" r="2.2" fill="#ffffff" opacity="0.95"/>
  <ellipse cx="39" cy="46" rx="6" ry="2.2" fill="#9fe8ff" opacity="0.4" transform="rotate(15 39 46)"/>
</svg>
